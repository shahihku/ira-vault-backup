name: Islamic Agent Remote Zero-Load Backup

on:
  schedule:
    # Jalan otomatis tiap hari Minggu jam 03:00 WIB (20:00 UTC)
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      target:
        description: 'Pilih database yang ingin dibackup'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - corpus_only
          - history_only

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup SSH, Rclone & Dependencies
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.ssh ~/.config/rclone
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2703 103.149.177.249 >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Setup rclone config dari secret
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          
          sudo apt-get update -qq && sudo apt-get install -y zstd gnupg rsync rclone

      - name: Test SSH & Rclone Connection
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 2703 -o StrictHostKeyChecking=no zidan@103.149.177.249 "echo '[+] SSH Connection established successfully!'"
          rclone about gdrive-ira:

      - name: Pull & Encrypt Database
        env:
          ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          mkdir -p staging out
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

          # 1. Backup User History DB
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "history_only" ]; then
            echo "==> [1] Pulling webui_history.db from mahastore..."
            ssh -i ~/.ssh/id_ed25519 -p 2703 -o StrictHostKeyChecking=no zidan@103.149.177.249 \
              "python3 -c \"import sqlite3; src=sqlite3.connect('file:/home/zidan/projects/islamic-shamela-agent/data/webui_history.db?mode=ro', uri=True); dst=sqlite3.connect('/tmp/webui_snap.db'); src.backup(dst); src.close(); dst.close()\""
            
            # Raw wire transfer (tanpa flag -z) agar mahastore 0% CPU
            rsync -e "ssh -i ~/.ssh/id_ed25519 -p 2703 -o StrictHostKeyChecking=no" -avP \
              zidan@103.149.177.249:/tmp/webui_snap.db staging/webui_history.db
            
            ssh -i ~/.ssh/id_ed25519 -p 2703 -o StrictHostKeyChecking=no zidan@103.149.177.249 "rm -f /tmp/webui_snap.db"

            echo "==> Compressing & Encrypting User History on GitHub Runner..."
            zstd -6 -T0 staging/webui_history.db -o staging/webui_history.db.zst
            gpg --batch --yes --passphrase "$ENCRYPTION_KEY" --symmetric --cipher-algo AES256 \
              -o out/webui_history_${TIMESTAMP}.db.zst.gpg staging/webui_history.db.zst
            
            # Simpan juga versi plaintext .zst murni untuk Google Drive pribadi jika mau,
            # atau simpan versi .zst.gpg di Google Drive agar aman 100%
            cp out/webui_history_${TIMESTAMP}.db.zst.gpg staging/
            rm -f staging/webui_history.db staging/webui_history.db.zst
          fi

          # 2. Backup Corpus DB (Full master)
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "corpus_only" ]; then
            echo "==> [2] Pulling corpus.db from mahastore (Zero CPU compression on VPS)..."
            # Raw wire transfer (tanpa flag -z) agar mahastore 0% CPU
            rsync -e "ssh -i ~/.ssh/id_ed25519 -p 2703 -o StrictHostKeyChecking=no" -avP \
              zidan@103.149.177.249:/home/zidan/projects/islamic-shamela-agent/data/sqlite/corpus.db staging/corpus.db

            echo "==> Compressing & Encrypting Corpus DB on GitHub Runner (Balanced fast zstd -6)..."
            zstd -6 -T0 staging/corpus.db -o staging/corpus.db.zst
            gpg --batch --yes --passphrase "$ENCRYPTION_KEY" --symmetric --cipher-algo AES256 \
              -o out/corpus_${TIMESTAMP}.db.zst.gpg staging/corpus.db.zst
            
            cp out/corpus_${TIMESTAMP}.db.zst.gpg staging/
            rm -f staging/corpus.db staging/corpus.db.zst
          fi

          echo "==> Generated Encrypted Vault Files:"
          ls -lh out/

      - name: Upload to Google Drive (Zero Load on VPS)
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          echo "==> Uploading files to Google Drive (gdrive-ira:IslamicAgent_Backups)..."
          if [ -f out/webui_history_${{ env.TIMESTAMP }}.db.zst.gpg ]; then
            rclone copyto out/webui_history_${{ env.TIMESTAMP }}.db.zst.gpg \
              gdrive-ira:IslamicAgent_Backups/user_history/webui_history_${{ env.TIMESTAMP }}.db.zst.gpg --stats 5s
          fi
          
          if [ -f out/corpus_${{ env.TIMESTAMP }}.db.zst.gpg ]; then
            rclone copyto out/corpus_${{ env.TIMESTAMP }}.db.zst.gpg \
              gdrive-ira:IslamicAgent_Backups/corpus_master/corpus_${{ env.TIMESTAMP }}.db.zst.gpg --stats 5s
          fi
          echo "[+] Upload to Google Drive finished successfully!"

      - name: Upload to GitHub Release (Immutable Vault)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "backup-${{ env.TIMESTAMP }}"
          name: "Automated Encrypted Vault: ${{ env.TIMESTAMP }}"
          body: |
            Automated Encrypted Backup generated by GitHub Actions.
            - Files are encrypted using AES-256 (GPG symmetric).
            - Unreadable by public without `BACKUP_ENCRYPTION_KEY`.
            - Synced to Google Drive & GitHub Releases.
            - Zero load on Mahastore host during compression & upload.
          files: out/*
          fail_on_unmatched_files: true
