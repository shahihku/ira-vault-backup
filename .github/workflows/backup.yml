name: Islamic Agent Remote Zero-Load Backup

on:
  schedule:
    # Backup User DB tiap 6 jam: 03:00, 09:00, 15:00, 21:00 WIB (20:00, 02:00, 08:00, 14:00 UTC)
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Pilih database yang ingin dibackup'
        required: true
        default: 'history_only'
        type: choice
        options:
          - history_only
          - corpus_only
          - jawami_only
          - all

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup SSH, Rclone & Dependencies
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.ssh ~/.config/rclone
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          
          sudo apt-get update -qq && sudo apt-get install -y zstd gnupg rsync rclone python3

      - name: Determine Target
        run: |
          # Jika dipicu jadwal CRON:
          # - Default tiap 6 jam: 'history_only'
          # - Khusus hari Minggu jam 03:00 WIB (Day 7, UTC 20:00): 'all' (termasuk corpus & jawami mingguan)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY_OF_WEEK=$(date +%u)
            HOUR_UTC=$(date +%H)
            if [ "$DAY_OF_WEEK" -eq 7 ] && [ "$HOUR_UTC" = "20" ]; then
              echo "TARGET=all" >> $GITHUB_ENV
            else
              echo "TARGET=history_only" >> $GITHUB_ENV
            fi
          else
            echo "TARGET=${{ inputs.target }}" >> $GITHUB_ENV
          fi

      - name: Test SSH & Rclone Connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "echo '[+] Remote SSH Connection established successfully!'"
          rclone about gdrive-ira:

      - name: Pull & Encrypt Database
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          mkdir -p staging out
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

          # 1. Backup User History DB
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "history_only" ]; then
            echo "==> [1] Pulling webui_history.db from remote host..."
            ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
              "python3 -c \"import sqlite3; src=sqlite3.connect('file:/home/$SSH_USER/apps/islamic-agent/data/webui_history.db?mode=ro', uri=True); dst=sqlite3.connect('/tmp/webui_snap.db'); src.backup(dst); src.close(); dst.close()\""
              
            # Gunakan chacha20-poly1305 agar enkripsi SSH sangat ringan untuk CPU VPS
            scp -i ~/.ssh/id_ed25519 -P "$SSH_PORT" -o StrictHostKeyChecking=no -c chacha20-poly1305@openssh.com \
              "$SSH_USER@$SSH_HOST":/tmp/webui_snap.db staging/webui_history.db
              
            ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "rm -f /tmp/webui_snap.db"

            echo "==> Compressing & Encrypting User History on GitHub Runner..."
            zstd -6 -T0 staging/webui_history.db -o staging/webui_history.db.zst
            gpg --batch --yes --passphrase "$ENCRYPTION_KEY" --symmetric --cipher-algo AES256 \
              -o out/webui_history_${TIMESTAMP}.db.zst.gpg staging/webui_history.db.zst
            rm -f staging/webui_history*
          fi

          # 2. Backup Corpus DB (Full master)
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "corpus_only" ]; then
            echo "==> [2] Pulling corpus.db from remote host (Zero CPU compression on VPS)..."
            # Gunakan cipher chacha20 & buffer stream yang ringan
            scp -i ~/.ssh/id_ed25519 -P "$SSH_PORT" -o StrictHostKeyChecking=no -c chacha20-poly1305@openssh.com \
              "$SSH_USER@$SSH_HOST":/home/$SSH_USER/apps/islamic-agent/data/sqlite/corpus.db staging/corpus.db

            echo "==> Compressing & Encrypting Corpus DB on GitHub Runner (Balanced fast zstd -6)......"
            zstd -6 -T0 staging/corpus.db -o staging/corpus.db.zst
            gpg --batch --yes --passphrase "$ENCRYPTION_KEY" --symmetric --cipher-algo AES256 \
              -o out/corpus_${TIMESTAMP}.db.zst.gpg staging/corpus.db.zst
            rm -f staging/corpus*
          fi

          # 3. Backup Jawami DB (Hadith & Rijal DB)
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "jawami_only" ]; then
            echo "==> [3] Pulling jawami_v4.db from remote host (Zero CPU compression on VPS)..."
            scp -i ~/.ssh/id_ed25519 -P "$SSH_PORT" -o StrictHostKeyChecking=no -c chacha20-poly1305@openssh.com \
              "$SSH_USER@$SSH_HOST":/home/$SSH_USER/apps/islamic-agent/data/raw/jawami_v4.db staging/jawami_v4.db

            echo "==> Compressing & Encrypting Jawami DB on GitHub Runner (Balanced fast zstd -6)..."
            zstd -6 -T0 staging/jawami_v4.db -o staging/jawami_v4.db.zst
            gpg --batch --yes --passphrase "$ENCRYPTION_KEY" --symmetric --cipher-algo AES256 \
              -o out/jawami_v4_${TIMESTAMP}.db.zst.gpg staging/jawami_v4.db.zst
            rm -f staging/jawami_v4*
          fi

          echo "==> Generated Encrypted Vault Files:"
          ls -lh out/

      - name: Prune Old Backups & Upload to Google Drive
        run: |
          echo "==> Enforcing Retention Policy & Uploading to Google Drive..."

          python3 -u -c '
          import subprocess, sys

          def prune_remote(remote_dir, keep_count):
              print(f"--> Listing {remote_dir}...", flush=True)
              try:
                  out = subprocess.check_output(["rclone", "lsf", remote_dir, "--format", "tp"], text=True)
              except Exception as e:
                  print(f"Directory {remote_dir} may not exist yet, skipping prune: {e}", flush=True)
                  return
              
              entries = []
              for line in out.splitlines():
                  line = line.strip()
                  if not line or ";" not in line:
                      continue
                  parts = line.split(";", 1)
                  entries.append((parts[0].strip(), parts[1].strip()))
              
              entries.sort(key=lambda x: x[0], reverse=True)
              
              if len(entries) > keep_count:
                  to_delete = entries[keep_count:]
                  for ts, fname in to_delete:
                      print(f"    [Prune] Menghapus backup lama: {fname} (modtime: {ts})", flush=True)
                      subprocess.run(["rclone", "deletefile", f"{remote_dir}/{fname}"], check=False)
              else:
                  print(f"    [Prune] File di {remote_dir} ada {len(entries)}, belum melewati batas {keep_count}.", flush=True)

          # 1. Prune User History (Sisakan 5 existing sebelum upload -> total jadi 6)
          print("Checking retention for user_history (keep max 5 existing)...", flush=True)
          prune_remote("gdrive-ira:IslamicAgent_Backups/user_history", 5)

          # 2. Prune Corpus Master (Sisakan 1 existing sebelum upload -> total jadi 2)
          print("Checking retention for corpus_master (keep max 1 existing)...", flush=True)
          prune_remote("gdrive-ira:IslamicAgent_Backups/corpus_master", 1)

          # 3. Prune Jawami Master (Sisakan 1 existing sebelum upload -> total jadi 2)
          print("Checking retention for jawami_master (keep max 1 existing)...", flush=True)
          prune_remote("gdrive-ira:IslamicAgent_Backups/jawami_master", 1)
          '

          # Upload File Baru dengan chunk size optimal (64M), rate limiter anti-403, dan print progress (-P)
          if [ -f out/webui_history_${{ env.TIMESTAMP }}.db.zst.gpg ]; then
            echo "==> Uploading new user history backup..."
            rclone copyto out/webui_history_${{ env.TIMESTAMP }}.db.zst.gpg \
              gdrive-ira:IslamicAgent_Backups/user_history/webui_history_${{ env.TIMESTAMP }}.db.zst.gpg \
              --drive-chunk-size 64M --tpslimit 8 --retries 5 --low-level-retries 10 -P
          fi

          if [ -f out/corpus_${{ env.TIMESTAMP }}.db.zst.gpg ]; then
            echo "==> Uploading new corpus master backup..."
            rclone copyto out/corpus_${{ env.TIMESTAMP }}.db.zst.gpg \
              gdrive-ira:IslamicAgent_Backups/corpus_master/corpus_${{ env.TIMESTAMP }}.db.zst.gpg \
              --drive-chunk-size 64M --tpslimit 8 --retries 5 --low-level-retries 10 -P
          fi

          if [ -f out/jawami_v4_${{ env.TIMESTAMP }}.db.zst.gpg ]; then
            echo "==> Uploading new jawami master backup..."
            rclone copyto out/jawami_v4_${{ env.TIMESTAMP }}.db.zst.gpg \
              gdrive-ira:IslamicAgent_Backups/jawami_master/jawami_v4_${{ env.TIMESTAMP }}.db.zst.gpg \
              --drive-chunk-size 64M --tpslimit 8 --retries 5 --low-level-retries 10 -P
          fi

          echo "[+] Sync and upload completed successfully!"
